<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Scribe音声入力</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { width: 360px; padding: 12px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
    .row h1 { margin: 0; }
    #history { list-style: none; padding: 0; margin: 8px 0 0; max-height: 340px; overflow-y: auto; }
    #history li { border-top: 1px solid var(--line); padding: 8px 0; }
    #history .text { white-space: pre-wrap; word-break: break-all; }
    #history .meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    #history button { padding: 2px 8px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="row">
    <h1>Scribe音声入力</h1>
    <a href="options.html" target="_blank">設定</a>
  </div>
  <div class="row">
    <button id="toggle" class="primary">録音開始</button>
    <span class="muted">ショートカット: <a href="#" id="shortcut"></a></span>
  </div>
  <h2>履歴</h2>
  <ul id="history"></ul>
  <script type="module" src="popup.js"></script>
</body>
</html>
